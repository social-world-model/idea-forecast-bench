model_name: "gpt-4o"
max_context_chars: 15000
temperature: 0.0
# Prompt text lives under live_idea_bench/prompt/*.yaml. This file only stores runtime defaults.
openai_api_key: ""

embedding:
  model_name: "all-MiniLM-L6-v2"
  max_context_chars: 8000
  use_section_weights: true
  abstract_weight: 0.4
  introduction_weight: 0.2
  method_weight: 0.2
  conclusion_weight: 0.2
  # Voyage AI embedding endpoint (OpenAI-compatible).
  # Set OPENAI_API_KEY to your Voyage API key at runtime.
  embedding_base_url: "https://api.voyageai.com/v1"
  api_model: "voyage-3"

