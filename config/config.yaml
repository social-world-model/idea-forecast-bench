model_name: "gpt-4o"
max_context_chars: 15000
temperature: 0.0
# Prompt text lives under idea_forecast_bench/prompt/*.yaml. This file only stores runtime defaults.
# Credentials are read from the environment (OPENAI_API_KEY, ANTHROPIC_API_KEY,
# GOOGLE_API_KEY, VOYAGE_API_KEY) -- never put a key in this file.

embedding:
  model_name: "all-MiniLM-L6-v2"
  max_context_chars: 8000
  use_section_weights: true
  abstract_weight: 0.4
  introduction_weight: 0.2
  method_weight: 0.2
  conclusion_weight: 0.2
  # Voyage embedding endpoint. Empty → Voyage default URL
  # (https://api.voyageai.com/v1). Embedding is Voyage-only: requires
  # VOYAGE_API_KEY and fails loud — no local/lexical fallback.
  embedding_base_url: ""
  api_model: "voyage-3-large"

# The 52-topic taxonomy lives in exactly one place. It used to be duplicated
# here verbatim (~800 identical lines), so editing one copy silently diverged
# from the other: idea_forecast_bench/config.py read this file while
# forecaster/hindsight/topic_sampling.py read topics_v2.yaml.
topics_file: config/topics_v2.yaml
