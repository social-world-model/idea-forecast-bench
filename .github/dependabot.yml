# Previously this covered pip at "/" only, on a daily cadence with no PR cap.
# npm (frontend) and the GitHub Actions themselves -- where 14 uses of
# deprecated @v2 actions had accumulated -- were not covered at all.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev-tooling:
        patterns: ["ruff", "mypy", "pre-commit", "types-*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-types:
        patterns: ["@types/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
