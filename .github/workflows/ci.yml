name: CI

# One pipeline, one required status check. This replaced eight overlapping
# workflows (ci / codespell / isort / mypy / pre-commit / pytest / ruff /
# tests) where five were failing on main, two were duplicates of each other,
# and the only green one -- pre-commit -- had no run step at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        # Pinned to poetry.lock's version: an unpinned install here is exactly
        # the local-vs-CI drift this single-source-of-truth setup exists to stop.
        run: pip install pre-commit==3.8.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Runs ruff check, ruff format --check, codespell and the file hygiene
      # hooks. Note: no --fix anywhere. `[tool.ruff] fix = true` used to make
      # the lint job rewrite its own checkout and then report success.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # poetry must exist before setup-python, or `cache: poetry` has nothing
      # to read the lockfile with.
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      # mypy runs from the project environment, not from an isolated
      # pre-commit venv, so it can actually resolve third-party imports.
      - name: Install dependencies
        run: poetry install --with dev,webapp
      - name: Type-check
        run: poetry run mypy

  smoke:
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Bounds come from pyproject's requires-python (">=3.10,<3.13").
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      # Deliberately a core install -- no --with forecaster/eval. This is what
      # proves the README's "a core install is enough" claim on both supported
      # interpreters. No secrets are injected.
      - name: Install dependencies
        run: poetry install --with webapp
      # The repo has no test suite. These checks are cheap but not vacuous:
      # they catch a broken import graph, a missing dependency, a CLI entry
      # point that no longer resolves, and a dispatch table pointing at a
      # script that has been moved or deleted.
      - name: Packages import
        run: poetry run python -c "import idea_forecast_bench, forecaster, backend.app"
      - name: CLI responds
        run: poetry run idea-forecast-bench --help
      - name: CLI dispatch targets exist
        run: |
          poetry run python - <<'PY'
          import pathlib, re, sys
          src = pathlib.Path("idea_forecast_bench/__main__.py").read_text()
          targets = sorted(set(re.findall(r'"((?:benchmark|forecaster)/[a-z0-9_]+\.py)"', src)))
          missing = [t for t in targets if not (pathlib.Path("examples") / t).exists()]
          print(f"checked {len(targets)} CLI targets")
          if missing:
              sys.exit("missing dispatch targets: " + ", ".join(missing))
          PY
      - name: Config loads and the taxonomy resolves
        run: |
          poetry run python -c "
          from idea_forecast_bench.config import load_runtime_config
          n = len(load_runtime_config().topics)
          assert n == 52, f'expected 52 topics, got {n}'
          print('config OK:', n, 'topics')"

  # Single gate for branch protection: require "ci" and nothing else.
  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Requires success explicitly. Checking only for 'failure'/'cancelled'
      # let a *skipped* job through, which is the state a job lands in when
      # something upstream of it goes wrong.
      - name: Require every job to have succeeded
        if: >-
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.smoke.result != 'success'
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} smoke=${{ needs.smoke.result }}"
          exit 1
      - run: echo "all checks passed"
