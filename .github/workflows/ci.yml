name: CI

# One pipeline, one required status check. This replaced eight overlapping
# workflows (ci / codespell / isort / mypy / pre-commit / pytest / ruff /
# tests) where five were failing on main, two were duplicates of each other,
# and the only green one -- pre-commit -- had no run step at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Runs ruff check, ruff format --check, codespell and the file hygiene
      # hooks. Note: no --fix anywhere. `[tool.ruff] fix = true` used to make
      # the lint job rewrite its own checkout and then report success.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # poetry must exist before setup-python, or `cache: poetry` has nothing
      # to read the lockfile with.
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      # mypy runs from the project environment, not from an isolated
      # pre-commit venv, so it can actually resolve third-party imports.
      - name: Install dependencies
        run: poetry install --with dev,webapp
      - name: Type-check
        run: poetry run mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bounds come from pyproject's requires-python (">=3.10,<3.13").
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      # Deliberately a core install: no --with forecaster/eval. The suite is
      # fully mocked and needs neither the GPU stack nor any API key, and the
      # README claims a core install is enough -- this job is what makes that
      # claim true. No secrets are injected here on purpose.
      - name: Install dependencies
        run: poetry install --with test,webapp
      - name: Run tests
        run: poetry run pytest -q

  # Single gate for branch protection: require "ci" and nothing else.
  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all checks passed"
