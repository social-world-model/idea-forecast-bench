name: Security

# CodeQL was the obvious choice here, but it cannot pass on this repository:
# uploading its results needs GitHub Advanced Security, which is not enabled
# ("Advanced Security must be enabled for this repository to use code
# scanning"). Shipping a workflow that is guaranteed red would recreate
# exactly the problem this repo just dug itself out of, so this runs the
# checks that do work without that feature.
#
# To add CodeQL: enable Settings -> Code security -> Code scanning, then add
# a standard github/codeql-action workflow.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-deps:
    name: python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==2.2.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      # Every group, forecaster included. torch/transformers/trl are the
      # largest dependency surface in the project; auditing everything except
      # them, while the comment claimed otherwise, was the worst of both.
      - name: Install dependencies
        run: poetry install --with dev,webapp,forecaster
      - name: pip-audit
        # pipx, not `poetry run pip install pip-audit`: installing the auditor
        # into the environment under audit adds its own dependency tree to the
        # thing being measured. --path points it at poetry's site-packages.
        run: |
          pipx install pip-audit
          SITE_PACKAGES="$(poetry run python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          pip-audit --path "$SITE_PACKAGES" --progress-spinner off \
            --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-1795 \
            --ignore-vuln PYSEC-2026-1796 --ignore-vuln PYSEC-2026-2875 \
            --ignore-vuln PYSEC-2026-2876
        # The ignored IDs are all pip's own advisories. pip is the installer
        # present in every virtualenv, not a declared dependency of this
        # project, and its version is controlled by the runner image.

  npm-deps:
    name: frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Advisory only. The frontend is on deprecated react-scripts, whose
      # transitive tree carries known issues that cannot be fixed without
      # migrating off CRA; failing the build on them would be noise nobody
      # can action. Reported so the state stays visible.
      - name: npm audit (report only)
        run: npm audit --audit-level=critical || true
