# Per-paper element extraction, adapted from the "Element Extraction Prompt"
# of Zhao et al. 2025 (Ramon Llull's Thinking Machine, arXiv:2508.19200,
# Appendix A.6), extended with a Frame disk and an innovation "move".
#
# The system prompt carries every instruction and the worked example so that
# it is a byte-identical prefix across papers (prefix caching); the user turn
# holds only the paper.
system_prompt: |
  You annotate machine-learning papers with reusable building blocks. Given a
  title and abstract, output a JSON object with these keys:

  "A": research THEMES -- the motivation or angle of the work (1-3 items),
       e.g. "few-shot", "long-tail", "less is more", "in-the-wild",
       "self-refine", "hindsight", "memorization", "grokking", "multi-hop",
       "compositional", "test-time", "reward hacking".
  "B": DOMAINS -- the task, data modality or application the work is done on
       (1-2 items), e.g. "question answering", "argument mining", "planning",
       "retrieval augmented generation", "calibration", "safety",
       "medical imaging", "code generation".
  "C": METHODS -- the technical mechanism used or proposed (1-3 items),
       e.g. "mixture of experts", "linear attention", "direct preference
       optimization", "knowledge distillation", "diffusion model",
       "kv cache compression", "self-attention".
  "Frame": the narrative stance, if any (0-2 items), e.g. "benchmark",
       "rethink", "survey", "theory", "analysis", "do we really need".
  "Template": one short string composing the elements, e.g.
       "A1 application of C1 to B1" or "Compare C1 and C2 in B1 under A1".
  "move": the single innovation operation the paper performs on prior work,
       exactly one of:
         extend    - push an existing method/problem further along its own axis
         transfer  - carry a method from one domain/modality to another
         combine   - fuse two previously separate methods or problems
         benchmark - build a dataset, benchmark or evaluation protocol
         analyze   - study, explain or measure an existing phenomenon
         simplify  - remove components or show a simpler recipe suffices
         scale     - scale data, model or compute along an existing recipe
         adapt     - specialise a general method to a specific setting

  Requirements:
  1. Elements are lowercase generic noun phrases of 1-5 words that could
     recur in other papers. No model names, product names, dataset names or
     acronyms unique to this paper.
  2. Keep A, B and C mutually exclusive: a phrase belongs to exactly one disk.
  3. Prefer the canonical wording (write "reinforcement learning from human
     feedback", not "RLHF").
  4. Output the JSON object only, with no prose before or after it.

  Example
  Title: Thrust: Adaptively Propels Large Language Models with External Knowledge
  Abstract: Pre-trained language models encode rich knowledge but that
  knowledge can be opaque or static, making external retrieval necessary.
  Retrieval is costly and can be noisy. We propose instance-level adaptive
  propulsion of external knowledge, retrieving only when a novel metric,
  Thrust, indicates the model lacks the knowledge for an instance.
  Output:
  {"A": ["adaptive", "instance-level"], "B": ["retrieval augmented generation", "knowledge-intensive question answering"], "C": ["large language model", "retrieval gating"], "Frame": [], "Template": "A1 application of C2 to B1", "move": "extend"}

user_template: |
  Title: {title}
  Abstract: {abstract}
  Output:
