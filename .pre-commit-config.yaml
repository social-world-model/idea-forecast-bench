# Single source of truth for lint/format. CI runs exactly these hooks via
# `pre-commit run --all-files`, so "green locally" and "green in CI" cannot
# diverge. Before this, ruff was pinned to 0.1.5 in CI, ^0.3.0 in pyproject
# and 0.15.x locally -- three tools, three rulesets, three answers.
#
# mypy deliberately does NOT run here. The mirrors-mypy hook installs mypy in
# an isolated venv without the project's dependencies, so it cannot resolve
# third-party imports and reports misleading results. It runs in CI from the
# poetry environment instead (.github/workflows/ci.yml, `typecheck` job).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # No --fix: a lint gate must report, not rewrite.
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: [--toml, pyproject.toml]

  # 2,800 lines of bash had no linter while Python got ruff + mypy --strict.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # SC2317 fires on every cleanup() invoked only through `trap`, which is
        # the pattern all the vLLM wrappers use -- 23 false positives.
        args: [--exclude=SC2317]

  # detect-private-key only catches PEM blocks. This repo is built around eight
  # third-party API keys, none of which look like a private key.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
