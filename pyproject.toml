[project]
name = "live-idea-bench"
version = "0.0.1"
description = "LiveIdeaBench: forecasting emerging research ideas against future literature."
authors = [{ name = "Haofei Yu", email = "yuhaofei44@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    # Core data and config
    "pydantic>=2.8.2,<3",
    "pyyaml>=6.0",
    # LLM API clients
    "anthropic",
    "openai>=1.0.0",
    "google-generativeai",
    # Utilities
    "beartype",
    "requests>=2.28.0",
    "backoff",
    "rich",
    "flask>=3.0.0",
    "flask-cors>=6.0.5,<7",
    "openreview-py",
    "pandas>=2.2.0",
]

[tool.poetry]
package-mode = false

# --- Optional extras ------------------------------------------------------
# Core deps above are all the benchmark needs (LLM-API baselines + the
# retrieve-then-judge protocol against a hosted judge). The groups below pull
# the heavy ML stack only when you train or run the MDF forecaster locally.
#
#   poetry install --with forecaster   # train/run the MDF forecaster
#   poetry install --with eval         # local-embedder retrieve-then-judge

# MDF forecaster: SFT the prior + GRPO-train the realization policy locally.
[tool.poetry.group.forecaster]
optional = true

# GPU training extras. NOTE: `torch` here is only a loose marker — `poetry
# install --with forecaster` pulls a default-index torch whose CUDA build may
# not match your driver. Install the CUDA-correct torch with the setup scripts
# instead (scripts/setup_rl_env_*.sh, scripts/setup_new_machine.sh), which pin
# the right +cuXXX wheel via --index-url for your GPU.
[tool.poetry.group.forecaster.dependencies]
torch = ">=2.0"
transformers = ">=4.40"
trl = ">=0.9"
peft = ">=0.10"
datasets = ">=2.18"
accelerate = ">=0.27"
sentence-transformers = ">=2.7"

# Evaluation extra: local sentence-transformer embedder fallback for the
# retrieve-then-judge protocol when no hosted embedding API is configured.
[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
sentence-transformers = ">=2.7"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"
nbmake = "^1.5.0"
types-setuptools = "^69.0.0.0"
ruff = "^0.3.0"
commitizen = "^3.14.1"
matplotlib = ">=3.10.8"
# Removed black and isort since we're using ruff

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.98.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "normal"
strict = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.codespell]
ignore-words-list = "dout, te, indicies, astroid"
skip = ["data"]

[tool.isort]
profile = "black"
use_parentheses = true
skip_gitignore = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310']

[tool.ruff]
line-length = 88
fix = true
target-version = "py310"

[tool.ruff.format]
indent-style = "space"
