[project]
name = "live-idea-bench"
version = "0.0.1"
description = "LiveIdeaBench: forecasting emerging research ideas against future literature."
authors = [{ name = "Haofei Yu", email = "yuhaofei44@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Config
    "pyyaml>=6.0",
    # LLM API clients
    "anthropic",
    "openai>=1.0.0",
    "google-generativeai",
    # HTTP
    "requests>=2.28.0",
    # Imported at module top level by the core packages -- previously resolved
    # only transitively through the optional torch stack:
    #   tqdm  -> live_idea_bench/backtest.py
    #   numpy -> forecaster/foresight/{gates,indices,metrics,reward}.py,
    #            forecaster/embedding/local_embedder.py
    "tqdm>=4.66",
    "numpy>=1.24",
]

[project.scripts]
live-idea-bench = "live_idea_bench.__main__:main"

[tool.poetry]
# The two packages are installed in EDITABLE mode (poetry's default for the
# root project). That is deliberate and load-bearing: several modules resolve
# repo-root assets that live OUTSIDE the packages via
# `Path(__file__).resolve().parents[N]` --
#
#   live_idea_bench/config.py     -> config/config.yaml
#   live_idea_bench/__main__.py   -> examples/          (CLI dispatch target)
#   live_idea_bench/ingest.py     -> data/
#   forecaster/config.py          -> config/forecaster/
#   forecaster/realization/config.py, forecaster/foresight/operators.py,
#   forecaster/hindsight/topic_sampling.py
#
# Under an editable install `__file__` still points into the repo, so those
# resolve correctly. A built wheel would relocate the packages into
# site-packages and every one of those paths would silently point at nothing.
# Do not publish this as a wheel without first moving config/ and the CLI's
# entry scripts inside the packages.
packages = [
    { include = "live_idea_bench" },
    { include = "forecaster" },
]

# --- Optional extras ------------------------------------------------------
# Core deps above are all the benchmark needs (LLM-API baselines + the
# retrieve-then-judge protocol against a hosted judge). The groups below pull
# the heavy ML stack only when you train or run the MDF forecaster locally.
#
#   poetry install --with forecaster   # train/run the MDF forecaster
#   poetry install --with eval         # local-embedder retrieve-then-judge
#   poetry install --with webapp       # the optional Flask API under backend/

# MDF forecaster: SFT the prior + GRPO-train the realization policy locally.
[tool.poetry.group.forecaster]
optional = true

# GPU training extras. NOTE: `torch` here is only a loose marker — `poetry
# install --with forecaster` pulls a default-index torch whose CUDA build may
# not match your driver. Install the CUDA-correct torch with the setup scripts
# instead (scripts/setup_rl_env_*.sh, scripts/setup_new_machine.sh), which pin
# the right +cuXXX wheel via --index-url for your GPU.
[tool.poetry.group.forecaster.dependencies]
torch = ">=2.0"
transformers = ">=4.40"
# The realization trainer needs GRPOTrainer, which landed in trl 0.14, and the
# entry scripts branch explicitly on TRL 1.0/1.4 APIs (GRPOConfig without
# max_prompt_length, GRPOConfig.vllm_group_port). The old ">=0.9" floor
# resolved to trl 0.11.4, which has no GRPOTrainer at all -- so the documented
# `python -m live_idea_bench train` could not run against the locked version.
trl = ">=1.4"
peft = ">=0.10"
datasets = ">=2.18"
accelerate = ">=0.27"
sentence-transformers = ">=2.7"
# Lazily imported by forecaster/realization/verl/dataset.py only.
pandas = ">=2.2.0"

# Evaluation extra: local sentence-transformer embedder fallback for the
# retrieve-then-judge protocol when no hosted embedding API is configured.
[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
sentence-transformers = ">=2.7"

# Optional web app: the Flask API under backend/ (see backend/README.md).
# Not needed to run the benchmark or the forecaster.
[tool.poetry.group.webapp]
optional = true

[tool.poetry.group.webapp.dependencies]
flask = ">=3.0.0"
flask-cors = ">=4,<7"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"
nbmake = "^1.5.0"
types-setuptools = "^69.0.0.0"
# Stub packages mypy needs to type third-party calls. Without these the
# typecheck job fails on a clean machine even though it passes wherever the
# stubs happen to already be installed.
types-pyyaml = "^6.0"
types-requests = "^2.31"
# Keep ruff/mypy pinned in lockstep with .pre-commit-config.yaml -- CI runs
# the pre-commit hooks, so a drift here means "green locally, red in CI".
ruff = "^0.15.0"
mypy = "^1.18.0"
commitizen = "^3.14.1"
matplotlib = ">=3.10.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# Checked explicitly by path (see .github/workflows/ci.yml). Pointing mypy at
# `.` makes it walk examples/ and scripts/, where two files can share a module
# name and mypy aborts with "Source file found twice under different module
# names" before checking anything.
files = ["live_idea_bench", "forecaster", "backend"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "normal"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.codespell]
# ehr = Electronic Health Records; unparseable is a legitimate spelling. Both
# were false positives that failed the old codespell workflow.
ignore-words-list = "dout, te, indicies, astroid, ehr, unparseable, disjointness, integrat, expandin, socio-economic"
# Lockfiles and vendored assets are machine-generated: package names there are
# not prose and must not be "corrected".
skip = [
    "*/data/*",
    "*.lock",
    "*package-lock.json",
    "*/node_modules/*",
    "*/build/*",
    "*/.git/*",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# NOTE: no `fix = true` here. It applies to `ruff check` as well, which made
# the lint job rewrite its own checkout in CI ("Found 155 errors (82 fixed,
# 73 remaining)"). Use `ruff check --fix` explicitly when you want fixes.

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (replaces isort)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    # Line length is the formatter's job; flagging it again in lint only
    # produces noise on lines the formatter has deliberately left long
    # (URLs, long string literals).
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports: __init__.py deliberately imports names it does not itself use.
"__init__.py" = ["F401"]
