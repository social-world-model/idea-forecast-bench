services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: live-idea-backend
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LIVE_IDEA_ADMIN_TOKEN=${LIVE_IDEA_ADMIN_TOKEN:-}
    expose:
      - '5000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: live-idea-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
