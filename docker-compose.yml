version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: live-idea-backend
    ports:
      - '5000:5000'
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: live-idea-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
